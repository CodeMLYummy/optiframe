# Formatting, lint, tests and builds on every push and pull request. Deployment stays with Cloud Build
# (trigger on main, see cloudbuild.yaml and docs/deploiement.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (Prettier, ESLint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Prettier (whole repo, from the root for .prettierignore)
        run: frontend/node_modules/.bin/prettier --check .
        working-directory: .
      - run: npm run lint
      - run: npm test -- --watch=false
      - run: npm run build

  backend:
    name: Backend (Spotless, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - run: ./mvnw -B -ntp spotless:check
      - run: ./mvnw -B -ntp verify

  python:
    name: Python (Ruff, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: format --check
      - uses: astral-sh/ruff-action@v3
        with:
          args: check
      - name: System library for OpenCV
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgl1
      - uses: astral-sh/setup-uv@v6
      - name: lensDetection tests
        working-directory: lensDetection
        run: uv run --python 3.14 python -m unittest discover -s tests -v

  shell:
    name: Shell (shfmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shfmt
        run: |
          curl -sSfL -o /usr/local/bin/shfmt https://github.com/mvdan/sh/releases/download/v3.14.1/shfmt_v3.14.1_linux_amd64
          chmod +x /usr/local/bin/shfmt
          shfmt -d $(git ls-files '*.sh') .githooks/*
