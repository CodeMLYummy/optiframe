spring.application.name=optiframe-api
server.port=${PORT:8080}

# Full-resolution phone photos are 3-8 MB.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

management.endpoints.web.exposure.include=health

# Comma-separated origins allowed to call the API (the deployed Angular app).
optiframe.cors-origins=${OPTIFRAME_CORS_ORIGINS:http://localhost:4200}
# Resolution of the rectified sheet image.
optiframe.px-per-mm=10
# Reject the photo if the homography fits the marker corners worse than this (mm).
optiframe.max-reprojection-error-mm=0.5
# Reject the photo if the lens window is blurrier than this (variance of the Laplacian).
# Calibrate on real photos: the measured value is returned in every response.
optiframe.min-sharpness=15
# Signed correction applied to the lens outline (mm). Calibrate against caliper measurements.
optiframe.edge-bias-mm=0.0
# Segmentation model (ONNX). If the file is missing, the classical segmenter is used.
optiframe.model-path=${OPTIFRAME_MODEL_PATH:models/lens-seg.onnx}
optiframe.model-input-size=512
# If set, every successful measurement saves the window crop and its mask here (auto-labeled dataset).
optiframe.dataset-dir=${OPTIFRAME_DATASET_DIR:}
